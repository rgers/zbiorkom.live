name: zbiorkom_mobile
description: "zbiorkom.live native Flutter mobile application for iOS and Android."
publish_to: "none"
version: 4.8.0+1

environment:
    sdk: ^3.13.5

dependencies:
    flutter:
        sdk: flutter
    flutter_localizations:
        sdk: flutter
    cupertino_icons: ^1.0.8
    flutter_riverpod: ^2.6.1
    dio: ^5.8.0+1
    http: ^1.3.0
    go_router: ^15.1.1
    flutter_map: ^8.1.1
    latlong2: ^0.9.1
    shared_preferences: ^2.5.3
    geolocator: ^14.0.0
    share_plus: ^11.0.0
    intl: ^0.20.2

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0

flutter:
    uses-material-design: true
